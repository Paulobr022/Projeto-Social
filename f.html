<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animações
    </title>
    <style>
        div {
            background-color: lightblue;
            width: 200px;
            height: 200px;
            margin: 30px;
            transition-property: background-color 1s, border-radius;
            transition-duration: 1s, 2s;
            transition-timing-function: cubic-bezier(.15, .20, .20, .26);
        }

        div:hover {
            background-color: lightgreen;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
